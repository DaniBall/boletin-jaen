name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    outputs:
      # La lista de ciudades sale del registro, no de este archivo.
      ciudades: ${{ steps.ciudades.outputs.lista }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Listar las ciudades del registro
        id: ciudades
        run: echo "lista=$(npx tsx scripts/cli.ts ciudades --json)" >> "$GITHUB_OUTPUT"

  construir:
    name: Build de ${{ matrix.ciudad }}
    needs: comprobar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ciudad: ${{ fromJSON(needs.comprobar.outputs.ciudades) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          CIUDAD: ${{ matrix.ciudad }}

      # No despliega: solo comprueba que el Worker de la ciudad es válido y
      # que encuentra los assets del build.
      - name: Comprobar el Worker
        run: npm run deploy -- --dry-run
        env:
          CIUDAD: ${{ matrix.ciudad }}
